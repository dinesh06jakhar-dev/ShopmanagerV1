name: Build Shop Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q ShopManagerV1_PhoneBuild.zip -d extracted
          cp -r extracted/app .
          cp extracted/build.gradle.kts .
          cp extracted/settings.gradle.kts .
          cp extracted/gradle.properties .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopManagerV1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
